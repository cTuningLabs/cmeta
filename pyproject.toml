[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmeta"
dynamic = ["version"]
description = "Common Meta Framework (cMeta/cX): code, data, models, scripts, workflows, agents and notes as uniform artifacts behind one CLI and one Python API - for collaborative, reproducible, reusable, scalable, portable and sustainable R&D."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "COPYRIGHT", "NOTICE"]
authors = [
    {name = "Grigori Fursin", email = "gfursin@ctuninglabs.com"},
    {name = "cTuning Labs"}
]
keywords = [
    "reproducibility", "research-software", "workflow", "automation",
    "metadata", "provenance", "knowledge-graph", "benchmarking",
    "portability", "ai-agents", "open-science", "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
     "pyyaml",
     "requests",
     "setuptools",
     "wheel",
     "tabulate",
     "tqdm",
     "filelock",
     "packaging",
     "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "flake8",
]

# asyncio is part of the Python standard library — no PyPI package required.
# Kept as an extra so `cmeta[server]` can continue to reference it.
async = []

server = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "starlette",
    "itsdangerous",
    "cmeta[async]",
]

all = ["cmeta[dev,async,server]"]


[project.urls]
Homepage = "https://cTuning.ai"
Repository = "https://github.com/cTuningLabs/cmeta"
Documentation = "https://github.com/cTuningLabs/cmeta/blob/main/docs/README.md"
Course = "https://cTuning.ai/project/cmeta/cmeta.course/"
Issues = "https://github.com/cTuningLabs/cmeta/issues"
Changelog = "https://github.com/cTuningLabs/cmeta/blob/main/CHANGELOG.md"
Author = "https://cTuning.ai/@gfursin"
Paper = "https://arxiv.org/abs/2406.16791"


[project.scripts]
cmeta = "cmeta.cli:main_cmeta"
meta = "cmeta.cli:main_meta"
cx = "cmeta.cli:main_cx"
cxt = "cmeta.cli:main_cxt"
cserver = "cmeta.cli:main_cserver"

ucmeta = "cmeta.cli:main_ucmeta"
umeta = "cmeta.cli:main_umeta"
ucx = "cmeta.cli:main_ucx"
ucxt = "cmeta.cli:main_ucxt"
ucserver ="cmeta.cli:main_ucserver"

[tool.setuptools.dynamic]
version = {attr = "cmeta.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["cmeta*"]
exclude = ["tests*", "*.tests", "*.tests.*", "cmeta.tests*"]

[tool.setuptools]

[tool.setuptools.package-data]
"cmeta" = [
    "internal-repo/**/*.json",
    "internal-repo/**/*.yaml",
    "internal-repo/**/*.yml",
    "internal-repo/**/*.md",
    "internal-repo/**/*.py",
    "internal-repo/**/*.bat",
    "internal-repo/**/*.sh",
    "internal-repo/**/*.txt",
    "internal-repo/**/*.ico",
    "internal-repo/**/*.js",
    "internal-repo/**/*.html",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "tests/**/*",
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["cmeta"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
