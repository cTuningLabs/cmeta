name: Test cMeta website build (cTuning.org/ae)

on:
  workflow_dispatch:
#  push:
#    paths:
#      - '**'
#      - '!**.md'
#  pull_request:
#    branches:
#      - main
#      - dev

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux & macOS
      - name: Dummy (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "======================="
          echo "Running on Linux/macOS"
          echo "======================="

      # Windows
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: |
          echo =======================
          echo Running on Windows
          echo =======================
        shell: cmd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print python version
        run: |
          python --version

      - name: Install package
        run: |
          python -m pip install --upgrade pip

      - name: Install cMeta framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[all]

      - name: Test cMeta
        run: |
          cx --reindex
          cx --version

      - name: Get artifact evaluation repo
        run: |
          cx repo get ctuning@artifact-evaluation

      - name: List website
        run: |
          cx --reindex
          cx website list

      - name: Build website
        run: |
          cx website build ctuning-org-ae --ignore_dirs=resources,hotcrp-config-2019

      - name: Dummy
        run: |
          echo "DONE"
