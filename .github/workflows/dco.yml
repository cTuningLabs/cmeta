#
# DCO (Developer Certificate of Origin) sign-off check
#
# Copyright (C) 2025-2026 Grigori Fursin and cTuning Labs. All rights reserved.
#
# Verifies that every commit in a pull request carries a valid "Signed-off-by"
# line matching the commit author, per the project's DCO-based contribution
# policy (see CONTRIBUTING.md and the DCO file). Self-contained: no third-party
# actions are used.
#

name: DCO

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          # Fetch the full range of PR commits so we can inspect each one.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Commits introduced by this PR (base..head, excluding merges).
          commits=$(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")

          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          fail=0
          while IFS= read -r sha; do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"

            # Match the sign-off trailer exactly against the commit author.
            if git show -s --format='%B' "$sha" | grep -qxF "$expected"; then
              echo "PASS  ${sha:0:12}  ${subject}"
            else
              echo "FAIL  ${sha:0:12}  ${subject}"
              echo "      missing or mismatched sign-off"
              echo "      expected: ${expected}"
              fail=1
            fi
          done <<< "$commits"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a matching 'Signed-off-by' line."
            echo "Sign off your commits and update the pull request:"
            echo "  git rebase --signoff ${BASE_SHA}..HEAD"
            echo "  git push --force-with-lease"
            echo "See CONTRIBUTING.md and the DCO file for details."
            exit 1
          fi

          echo ""
          echo "All commits are signed off. DCO check passed."
