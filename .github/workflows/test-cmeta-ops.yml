name: Test cMeta ops

on:
  push:
    paths:
      - '**'
      - '!**.md'
  pull_request:
    branches:
      - main
      - dev

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux & macOS
      - name: Dummy (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "======================="
          echo "Running on Linux/macOS"
          echo "======================="

      # Windows
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: |
          echo =======================
          echo Running on Windows
          echo =======================
        shell: cmd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print python version
        run: |
          python --version

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Test cMeta CLI
        run: |
          cx --reindex
          cx --version

      - name: Get cMeta Ops repo
        env:
          GH_USER: gfursin
          GH_TOKEN: ${{ secrets.PRIVATE_GH_TOKEN_CMETA_OPS }}
        run: |
          cx repo get --url=https://${GH_USER}:${GH_TOKEN}@github.com/cTuningLabs/cmeta-ops
          cx --reindex
          cx category list
