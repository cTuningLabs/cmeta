# The keys of the config artifact "cserver" that the page /browse reads (on every request: no restart needed).

configs:
  cserver:
    keys:
      hide_repos:
        desc: repositories whose artifacts the pages leave out (aliases or fnmatch patterns, comma-separated) - the same
          key for /projects, /browse and /cmeta.configs
        type: list
        example: my-private-repo
      browse_hide_categories:
        desc: categories /browse leaves out; unset = anything matching *crypt*, *secret* or *credential* (key bundles
          never show), none = every category
        type: list
        default: '*crypt*,*secret*,*credential*'
      browse_search_skip_keys:
        desc: the keys of the meta and the _desc whose values the plain words of a search do not read (the dashboard, the pages and
          /browse search the same way) - patterns on the dotted key or any part in front (generator skips
          generator.by); unset = the authorship every artifact carries, so that a name finds the artifacts about it,
          not all of them; none = every value searched; the key qualifiers (authors:x, has:x) read every key
        type: list
        default: copyright,control,authors,contributors,generator,last_generator,artifact_defaults
        example: copyright,control,authors,contributors,generator,last_generator,artifact_defaults,owner
      browse_files:
        desc: yes = the file browser for everyone the server lets in, no = for no one; unset = a browser on the
          server's own machine only
        type: yes/no
        default: this machine's browser only
      browse_edit:
        desc: yes = the editor (files, _cmeta, _desc, new artifacts) for everyone the host lets in, no = for no one;
          unset = a browser on the server's own machine, or what a host grants a signed-in reader
        type: yes/no
        default: this machine's browser only
      browse_file_search:
        desc: yes = the file search - an index of the names of every file inside the artifacts of this machine and of the
          texts of the readable kinds (result::local:cserver-browse-files, built by the server in the background) - the
          switches "file names" / "file contents" of /browse and the terms file:<name or glob> and text:<words>; no or
          unset = off (a hosted server keeps it off)
        type: yes/no
        default: 'no'
      browse_file_search_skip_categories:
        desc: the categories the file index leaves out (aliases, comma-separated; none = no category) - machine output
          rather than the user's files, and cMeta's own definitions and settings; the categories of keys and secrets
          and the repositories (repo) are never indexed, whatever this says
        type: list
        default: tmp,cache,log,state,result,website,category,config
      browse_file_search_skip_folders:
        desc: the folders the file index never enters, by name, at any depth inside an artifact (comma-separated; none = no
          folder); dot-folders, symlinks and the folders of keys and secrets are left out anyway
        type: list
        default: .git,.venv,venv,node_modules,__pycache__,site-packages,.pytest_cache,.mypy_cache,.ruff_cache,.idea,.vscode,dist,build
      browse_file_search_text:
        desc: the kinds of files (extensions, comma-separated) whose text goes into the index - the kinds Python reads
          without a library; docx, pptx and xlsx through their XML; every other kind is found by its name alone
        type: list
        default: md,txt,rst,yaml,yml,json,csv,tsv,eml,html,htm,tex,py,sh,bat,ps1,ipynb,docx,pptx,xlsx
      browse_file_search_max_kb:
        desc: how much of a file's text goes into the index (its first KB)
        type: int
        default: 256
      browse_file_search_depth:
        desc: how deep inside an artifact the index looks (0 = its top folder only)
        type: int
        default: 10
      browse_file_search_refresh:
        desc: when the index looks by itself for files added, removed or changed outside cMeta (every folder's time,
          every text file's size and time) - never = only the Refresh button of /browse and cx cserver.browse files
          --sweep (they build the first index too); start = once, when the server starts (a page first opens); or a
          number of minutes between two sweeps
        default: never
        example: start
      browse_file_search_follow:
        desc: yes = an artifact added, moved or deleted through cMeta is indexed (or dropped) by itself, as soon as a
          page notices the change of the index; no = at the next refresh only
        type: yes/no
        default: 'yes'
      browse_open:
        desc: no = no Open folder / Shell / Far buttons; unset = for a browser on the server's own machine
        type: yes/no
      browse_far:
        desc: the Far Manager (or far2l) to run, when it is not on PATH or in its usual folder
        type: path
      browse_terminal:
        desc: the terminal of the Shell button (default - COMSPEC on Windows, Terminal on macOS, the first terminal
          emulator found on Linux)
        type: path
      browse_title:
        desc: the heading and title of the page
        default: cMeta browse
      browse_default_query:
        desc: what a bare /browse opens with (an address that carries a query keeps its own)
      browse_default_repos:
        desc: the repositories a bare /browse ticks (comma-separated)
        type: list
      browse_default_cats:
        desc: the categories a bare /browse ticks (comma-separated)
        type: list
      browse_default_view:
        desc: the tab a bare /browse opens on - search, browse or graph
        example: browse
      browse_untick_repos:
        desc: repositories unticked whenever an address names none - an archive left out of every view until ticked
        type: list
        example: my-archive
      browse_hot_tags:
        desc: the tags of the Hot tags row, above the Tags of the facets - one click prunes the search by a tag, again
          takes it out; edited there too (rename, delete, add) by a viewer who may write
        type: list
        example: urgent,sla,review
      browse_favourite_categories:
        desc: the categories of the Favourites picker, in its order - one click browses a category alone (and adds an
          artifact there); the star of a category in the Categories picker adds or takes it out
        type: list
        example: note,journal,work
      browse_category_sort:
        desc: the order of a category's artifacts when nothing else is asked - "work,note:-alias;report:created,updated"
          ("-" turns a key around, "dated" lists the names without a date first, then the newest); goes before a
          category's own browse_sort
        example: work,note:-alias
