# The keys of the config artifact "cserver" that the home page /projects reads.

configs:
  cserver:
    keys:
      hide_repos:
        desc: repositories left off the cards (aliases or fnmatch patterns, comma-separated); their pages stay reachable
          at their own addresses
        type: list
      default_page:
        desc: what "/" shows (read by the server at startup) - /projects by default, none = the plain welcome page
        default: /projects
  default:
    keys:
      cserver_projects_create_repo:
        desc: the repository the "Make my view" panel of the customized view offers first (the engine's rule for new
          artifacts of cserver.projects); a view's new buttons go where its buttons are
        default: local
