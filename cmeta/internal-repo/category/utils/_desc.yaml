# The keys of the config artifacts the utils category reads (the cTuning.ai API). The key <category_alias>_create_repo
# of the default config, read here by the dated categories' "add" until 0.38.8, is read by every create of the engine's
# core since 0.38.9 and declared by the config category; <category_alias>_create_cmd is no longer read.

configs:
  ctuning_server:
    desc: the cTuning.ai platform (cPlatform) this machine talks to - its API address and a personal key (both on the
      settings page of cTuning.ai)
    keys:
      url:
        desc: the API address of the cTuning.ai platform (cx utils access_ctuning_server)
        type: url
        default: https://cTuning.ai/api/v1
      api_key:
        desc: the personal API key of the cTuning.ai platform, sent as the x-api-key header
        secret: true
