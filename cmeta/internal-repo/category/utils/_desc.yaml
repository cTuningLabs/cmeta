# The keys of the config artifacts the utils category reads (the cTuning.ai API). The key <category_alias>_create_repo
# of the default config, read here by the dated categories' "add" until 0.38.8, is read by every create of the engine's
# core since 0.38.9 and declared by the config category; <category_alias>_create_cmd is no longer read.

configs:
  ctuning_server:
    desc: the cTuning.ai platform (cPlatform) this machine talks to - its API address and a personal key (both on the
      settings page of cTuning.ai)
    keys:
      url:
        desc: the API address of the cTuning.ai platform (cx utils access_ctuning_server)
        type: url
        default: https://cTuning.ai/api/v1
      api_key:
        desc: the personal API key of the cTuning.ai platform, sent as the x-api-key header
        secret: true

  # cx utils view_cref (2026-11-10): where the pages of this machine's cMeta server are, and the browser that opens them
  default:
    keys:
      cserver_url:
        desc: the address of this machine's cMeta server as a browser reaches it - cx utils view_cref opens /cref/<cRef>
          there; unset = http://127.0.0.1:<the port of the cserver config, 8004>; the machine's own name when its pages
          are read from other machines too (http://my-laptop:8004)
        type: url
        example: http://my-laptop:8004
      browser:
        desc: the browser cx utils view_cref opens pages with - a name Python's webbrowser knows (chrome, firefox,
          safari), or the command or path of one ("%s" stands for the address); unset = the system's default browser
        type: text
        example: firefox
