name: cMeta cref - the page of one artifact, named by its cRef
desc: 'The full-page view of one artifact: /cref/<category>::<alias>,<UID>[/<relative path>]. The title, the
  artifact''s text (README.md, or the file its category names - the latest dated copy of a note), the connections
  grouped by category, what connects to it, and, folded at the end, the commands, the _cmeta, the _desc and the
  files. The cRef stays in the address bar: it is how artifacts are referenced. Resolved and read through
  cserver.browse (one catalogue, the same rules); extended through cref_view in a category''s _cmeta.yaml or an
  artifact''s _desc.'
