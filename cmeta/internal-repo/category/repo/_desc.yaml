# The keys of the config artifacts the repo category reads (cx repo get / pull / plug ...).

configs:
  default:
    keys:
      default_git:
        desc: the git server a short repository name is cloned from - cx repo get <name> clones
          <default_git><owner>/<name>
        default: https://github.com/
        example: 'git@github.com:'
      default_git_repo:
        desc: the owner of a short repository name - cx repo get cmeta-aops makes the repository <owner>@cmeta-aops
        default: ctuninglabs
        example: my-org
      default_cmeta_repo_url:
        desc: where a cmeta://<name> repository is downloaded from as a zip (this address, the name, a dash ...)
        type: url
        default: https://cTuning.ai/project/cmeta/repos/files/cmr-
  ctuning_server:
    keys:
      api_key:
        desc: the personal API key of the cTuning.ai platform, sent with the zip download of a repository from it
        secret: true
      skip_ssl_certificate:
        desc: yes = such a zip download does not check the TLS certificate of the server (a test server only)
        type: yes/no
        default: 'no'

# What the commands of the repo category mean, for people: a page that builds command lines (the cMeta CLI builder)
# and help read it; the engine never reads it to run a command. The options themselves are described where they are
# declared: a comment at the end of each parameter of the command's function in api/v1.py.

cli_help:
  category:
    title: Repositories
    one: repository
    desc: Get the repositories that hold programs, tools and tasks, and keep them up to date
    order: [pull, list, status, reindex, plug, unplug, unzip, zip, create, delete]
    hide: [get_alias_from_url, init, move, space, clone, checkout, get, update, find]

  pull:
    title: Get or update
    desc: Download a repository, or bring the ones you have up to date
    arg1: A repository (ctuninglabs@cmeta-aops), an address (https://github.com/..., hf://owner/name) - or nothing, for all of them
    main: [checkout, identity]
    params:
      checkout: {example: main, choice: true}      # a choice: it changes what is pulled; shown first
      identity: {artifact: secret}

  list:
    title: List
    desc: The repositories of this installation

  status:
    title: Status
    desc: What changed in the repositories since their last commit

  reindex:
    title: Index again
    desc: Read a repository again after its files changed by hand
