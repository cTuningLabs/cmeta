name: cMeta configs - every key the plugged artifacts read from the config artifacts, in one searchable page
desc: 'The config artifacts (cx config set <name> --meta.<key>=<value>) and their keys as the artifacts plugged into
  this machine know them - declared in a "configs" block of their _desc.yaml, read by their code (a cached scan of
  the categories, tasks, tools, apps and programs), shown in their docs -, joined with what is set here: what each key
  does, its type and default, who reads it, its value on this machine (secrets hidden), the keys set here that nothing
  reads, and the command that changes each. Fewer repositories, fewer configs.'
